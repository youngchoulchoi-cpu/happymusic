<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16324f">
<title>펭귄 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 밝고 귀여운 모바일 디펜스 게임, 짧은 한국어 안내
   IDEA: 얼음 해안에서 펭귄 군단이 이글루를 지키는 횡스크롤 전장
   PICTURE: 캔버스 전장이 화면 대부분, 캐릭터는 모두 코드로 그린 오리지널
   COLOUR and TYPE: 하늘색·바다색 필드, 남색 조작부, 부리 주황 포인트 / Jua
   LAYOUT: 상단 HUD, 가운데 전장, 하단 출격 카드 (좁은 화면은 2줄) */
:root{color-scheme:light dark;--navy:#16324f;--deep:#0e2236;--card:#24476b;--ice:#eef8ff;--beak:#ff8a2a;--gold:#ffd27a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);color:#fff;font:16px/1.4 Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--navy)}
#hud{display:flex;align-items:center;gap:10px;padding:6px 10px;min-height:48px}
#hud .money{display:flex;align-items:center;gap:6px;font-size:20px;white-space:nowrap}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc23d 55%,#d98b0b);box-shadow:0 1px 0 #8a5a00}
#mmax{font-size:14px;opacity:.7}
#stname{flex:1;text-align:center;font-size:15px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:0;border-radius:10px;background:var(--card);min-width:44px;height:40px;padding:0 10px;cursor:pointer;font-size:16px}
.hb.mute{opacity:.45;text-decoration:line-through}
.hb:focus-visible,.card:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:relative;flex:1}
#cv3{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#stage.g3{background:linear-gradient(#5dbdf7,#bfe8ff 62%,#e8f7ff)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#bar{display:grid;grid-template-columns:84px repeat(5,minmax(0,1fr)) 84px;gap:6px;padding:6px 8px 8px}
@media(max-width:640px){#bar{grid-template-columns:repeat(5,minmax(0,1fr))}#wallet{grid-column:1/4;grid-row:2}#cannon{grid-column:4/6;grid-row:2}.nm{display:none}}
.card{position:relative;overflow:hidden;border:0;border-radius:12px;background:var(--card);padding:4px 2px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:filter .15s}
.card canvas{width:44px;height:40px}
.nm{font-size:13px;opacity:.85;white-space:nowrap}
.c{font-size:15px;color:var(--gold);white-space:nowrap}
.card.off{filter:grayscale(.75) brightness(.7)}
.card .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(5,15,30,.6);pointer-events:none}
.card:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.side{flex-direction:column;font-size:15px}
#wallet b,#cannon b{font-weight:400;font-size:17px}
#cannon .fill{position:absolute;left:0;bottom:0;top:0;width:0;background:linear-gradient(90deg,#2b8fd6,#7fd3ff);opacity:.45;pointer-events:none}
#cannon.ready{background:#ff8a2a;animation:glow 1s infinite alternate}
#cannon span,#cannon b{position:relative}
@keyframes glow{to{box-shadow:0 0 0 3px #ffe0b8,inset 0 -4px 0 rgba(0,0,0,.25)}}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,25,45,.75);z-index:5;padding:max(16px,env(safe-area-inset-top)) 16px 16px}
.ov.on{display:flex}
.panel{background:var(--ice);color:var(--navy);border-radius:22px;padding:20px;max-width:560px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 #9cc6e6}
.panel h1{font-size:clamp(32px,7vw,48px);line-height:1.05;margin:4px 0 6px;font-weight:400;color:var(--navy)}
.panel h2{font-size:34px;margin:0 0 8px;font-weight:400}
.panel p{margin:6px 0;font-size:16px;color:#36587a}
#hero{width:100%;height:auto;aspect-ratio:16/5;display:block;margin:6px 0}
.stages{display:grid;gap:8px;margin:12px 0}
.btn{border:0;border-radius:14px;background:var(--navy);color:#fff;min-height:48px;padding:8px 16px;font-size:17px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn.alt{background:var(--beak)}
.btn:disabled{background:#b7c9d9;color:#eef4f9;cursor:default}
.btn small{font-size:14px;opacity:.8;white-space:nowrap}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.row .btn{justify-content:center;flex:1 1 140px}
details{text-align:left;background:#fff;border-radius:14px;padding:10px 14px;color:#36587a}
summary{cursor:pointer;color:var(--navy);font-size:17px}
details ul{margin:8px 0 2px;padding-left:20px}
details li{margin:3px 0}
.tip{font-size:14px;color:#5a7a99;margin-top:10px}

.pg{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 6px;color:var(--navy);font-size:17px}
.pg .hb{color:#fff}.pg .hb:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.sb{border:0;border-radius:10px;min-height:42px;background:#fff;color:var(--navy);font-size:15px;cursor:pointer;box-shadow:inset 0 -3px 0 #c9dff0}
.sb.cl{background:#d9f3e4;box-shadow:inset 0 -3px 0 #9fd8b5}
.sb.now{background:var(--beak);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.sb.bs{outline:2px solid #e5484d;outline-offset:-2px}
.sb:disabled{background:#e3ecf3;color:#a9bccd;box-shadow:none;cursor:default;outline:0}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(14,34,54,.85);padding:8px 16px;border-radius:999px;font-size:17px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:3}
#toast.on{opacity:1}
@media(max-height:520px){#hero{display:none}.panel{padding:14px}.panel h1{font-size:30px;margin:0 0 4px}}
@media(prefers-reduced-motion:reduce){#cannon.ready{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="money"><i class="coin"></i><span id="money">0</span><span id="mmax">/ 0</span></div>
    <div id="stname">펭귄 대작전</div>
    <button class="hb" id="snd" aria-label="소리 켜기/끄기">♪</button>
    <button class="hb" id="spd" aria-label="게임 속도">x1</button>
    <button class="hb" id="pz" aria-label="일시정지">II</button>
  </div>
  <div id="stage"><canvas id="cv3"></canvas><canvas id="cv"></canvas><div id="toast"></div></div>
  <div id="bar"></div>

  <div class="ov on" id="menu"><div class="panel">
    <h1>펭귄 대작전</h1>
    <p>바다 친구들이 이글루를 노려요. 펭귄 군단을 보내 적 요새를 무너뜨리세요!</p>
    <canvas id="hero" width="960" height="300"></canvas>
    <div class="stages" id="stages"></div>
    <details><summary>하는 법</summary><ul>
      <li>아래 카드를 누르면 펭귄이 출격해요. 돈이 들고, 다시 쓰려면 잠깐 기다려야 해요.</li>
      <li><b>지갑</b>을 키우면 돈이 더 빨리, 더 많이 쌓여요.</li>
      <li><b>대포</b>가 다 차면 눌러서 적을 한 번에 밀어내요.</li>
      <li>적 요새를 부수면 승리, 이글루가 무너지면 패배예요.</li>
      <li>전장을 드래그하면 좌우로 둘러볼 수 있어요.</li>
      <li>키보드: 1~5 출격, Q 지갑, C 대포, Space 일시정지</li>
    </ul></details>
    <p class="tip" id="ptip"></p>
  </div></div>

  <div class="ov" id="pause"><div class="panel">
    <h2>일시정지</h2>
    <div class="row"><button class="btn alt" id="resume">계속하기</button><button class="btn" id="retry1">다시 시작</button><button class="btn" id="tomenu1">스테이지 선택</button></div>
  </div></div>

  <div class="ov" id="result"><div class="panel">
    <h2 id="rtitle">승리!</h2>
    <p id="rtext"></p>
    <div class="row"><button class="btn alt" id="next">다음 스테이지</button><button class="btn" id="retry2">다시 하기</button><button class="btn" id="tomenu2">스테이지 선택</button></div>
  </div></div>
</div>

<script>
{
const $=id=>document.getElementById(id);
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(+r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this};
const SV={get(k){let a=0,b=0;try{a=+localStorage.getItem('peng_'+k)||0}catch(e){}try{b=+parent.localStorage.getItem('tt2_peng_'+k)||0}catch(e){}return Math.max(a,b)},
 set(k,v){try{localStorage.setItem('peng_'+k,v)}catch(e){}try{if(parent!==window)parent.localStorage.setItem('tt2_peng_'+k,v)}catch(e){}}};
const cv=$('cv'),ctx=cv.getContext('2d');let C=ctx;
const WW=1500,WH=420,GY=360,PB=WW-90,EB=90,CANNON_T=28,MAXU=40;
const P=[
 {id:'kid',n:'꼬마펭',cost:75,cd:2.5,hp:120,atk:10,rng:26,spd:40,rate:1,area:0,kb:3,size:.9},
 {id:'shield',n:'방패펭',cost:150,cd:6,hp:700,atk:4,rng:24,spd:28,rate:1.4,area:0,kb:2,size:1.05},
 {id:'spear',n:'창펭',cost:260,cd:7,hp:150,atk:30,rng:160,spd:32,rate:2.2,area:0,kb:3,size:1},
 {id:'snow',n:'눈사람',cost:450,cd:14,hp:1200,atk:45,rng:40,spd:22,rate:2.4,area:1,kb:2,size:1.35},
 {id:'emp',n:'황제펭',cost:1000,cd:30,hp:2400,atk:150,rng:130,spd:26,rate:3,area:1,kb:1,size:1.8}
];
const E={
 crab:{hp:90,atk:8,rng:24,spd:34,rate:1.2,area:0,kb:2,size:1,rw:25},
 seal:{hp:420,atk:16,rng:30,spd:22,rate:1.8,area:0,kb:2,size:1.25,rw:70},
 puffer:{hp:60,atk:22,rng:22,spd:70,rate:1,area:1,kb:1,size:.95,rw:35},
 octo:{hp:220,atk:22,rng:150,spd:26,rate:2.4,area:0,kb:3,size:1.1,rw:90},
 shark:{hp:6000,atk:90,rng:70,spd:18,rate:2.6,area:1,kb:5,size:2.2,rw:600}
};
const ST0=[
 {n:'따뜻한 해변',base:1200,m:1,sp:[['crab',2,5]]},
 {n:'산호 암초',base:2000,m:1.1,sp:[['crab',2,4.5],['seal',14,16]]},
 {n:'복어 떼의 습격',base:2800,m:1.2,sp:[['crab',2,4.5],['puffer',8,8],['seal',22,18]]},
 {n:'먹물 요새',base:3800,m:1.35,sp:[['crab',1,4],['octo',10,13],['seal',20,15],['puffer',28,11]]},
 {n:'상어 왕의 바다',base:5500,m:1.5,sp:[['crab',1,3.8],['puffer',8,9],['octo',14,12],['seal',20,13]],boss:'shark'}
];
const NSTAGE=1000,SEAS=['따뜻한 해변','산호 암초','복어 해협','먹물 동굴','유빙 들판','오로라 만','폭풍 바다','심해 협곡','빙하 절벽','상어 왕국'];
const SC_=new Map();
function stage(i){
  if(SC_.has(i))return SC_.get(i);let st;
  if(i<5)st=Object.assign({pm:1,rm:ST0[i].m,pb:3000},ST0[i]);
  else{
    const k=i-4,g=1+k*.01,r=1.5+.9*(1-Math.exp(-k/300)),am=(1.5+2.5*(1-Math.exp(-k/300)))/r,f=1-.35*(1-Math.exp(-k/300)),boss=(i+1)%10===0,big=(i+1)%50===0;
    const sea=SEAS[Math.floor(i/10)%SEAS.length],sp=[['crab',1,3.8*f]];
    const pat=i%4;
    sp.push(['puffer',6+pat,(pat===1?7:9.5)*f],['octo',12-pat,(pat===2?10:12.5)*f],['seal',18,(pat===3?11:13.5)*f]);
    st={am,n:sea+' '+(i+1),base:Math.round((4500+1500*(1-Math.exp(-k/100)))*g/10)*10,m:g*r,rm:r,pm:g,pb:Math.round(3000*g),sp,boss:boss?'shark':null,bm:big?1.6:1};
  }
  st.i=i;SC_.set(i,st);return st;
}

const wrate=l=>25+12*l,wmax=l=>300+200*l,wcost=l=>60+60*l,WMAXL=8;
const MAXE=60;let save=Math.min(NSTAGE,SV.get('clear')),lastSt=Math.min(NSTAGE-1,SV.get('last')),page=-1;
let G=null,DPR=1,s=1,camX=WW,cw=0,ch=0,clock=0,lowQ=false,ema=.016,slowT=0;

/* ---------- sound (all synthesized) ---------- */
const AU={c:null,on:true,song:null,step:0,next:0,lvl:0,last:{}};
try{AU.on=localStorage.getItem('peng_snd')!=='0'}catch(e){}
const SC={min:[0,2,3,5,7,8,10],phr:[0,1,3,5,7,8,10],hmin:[0,2,3,5,7,8,11]};
const SONGS={
 menu:{bpm:100,root:45,sc:'min',prog:[0,5,3,4],bass:'1.......1...5...',k:'x.......x.......',s:'................',h:'....x.......x...',arp:1,pad:1,lead:'.'},
 s0:{bpm:132,root:45,sc:'min',prog:[0,5,3,4],bass:'1.1.2.1.1.1.2.1.',k:'x...x...x...x...',s:'....x.......x...',h:'..x...x...x...x.',lead:'4.4.4.5.4.3.2.--0...2.3.4---....5.5.5.6.5.4.3.--4...3.2.1---0...'},
 s1:{bpm:140,root:38,sc:'min',prog:[0,6,5,4],bass:'1.12.1.11.12.1.2',k:'x..x..x...x..x..',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.',arp:1,lead:'0.2.4.7.6.4.2.4.6---4---3---2...0.2.4.7.9.7.6.4.5---4---2---1...'},
 s2:{bpm:150,root:40,sc:'phr',prog:[0,1,0,6],bass:'11.111.111.11.1.',k:'x...x...x...x...',s:'....x..x....x..x',h:'.xxx.xxx.xxx.xxx',lead:'0.0.1.0...3.1.0.4..4..3..1..0...7.7.8.7...a.8.7.b..a..8..7..4...'},
 s3:{bpm:118,root:36,sc:'hmin',prog:[0,5,3,4],bass:'1...1.1.5...1.2.',k:'x.....x...x.....',s:'........x.......',h:'x.x.x.x.x.x.x.x.',pad:1,lead:'0-------3---2---4-------3---2---0-------3---5---6-------4-------'},
 s4:{bpm:160,root:42,sc:'min',prog:[0,5,2,6],bass:'1212121212121212',k:'x...x...x...x.x.',s:'....x.......x...',h:'xxxxxxxxxxxxxxxx',arp:1,lead:'7.7.7.8.9.8.7.4.5.5.5.7.8.7.5.4.7.7.7.8.9.a.b.c.b---9---8.7.6.4.'}
};
const mf=m=>440*2**((m-69)/12);
function auInit(){
  if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const c=AU.c=new AC(),comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;comp.connect(c.destination);
    AU.m=c.createGain();AU.m.gain.value=AU.on?.9:0;AU.m.connect(comp);
    AU.mu=c.createGain();AU.mu.gain.value=.5;AU.mu.connect(AU.m);AU.fx=c.createGain();AU.fx.gain.value=.85;AU.fx.connect(AU.m);
    const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=b;
    setInterval(sched,25);playSong(G?(G.over?null:'s'+G.i):'menu');
  }catch(e){AU.c=null}
}
function tone(type,f,t,d,g,dest,f2,filt){const c=AU.c,o=c.createOscillator(),a=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(g,t+.006);a.gain.exponentialRampToValueAtTime(.0001,t+d);let n=o;
  if(filt){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=filt;o.connect(fl);n=fl}n.connect(a);a.connect(dest);o.start(t);o.stop(t+d+.03)}
function noise(t,d,g,type,f,dest,q=1){const c=AU.c,sr=c.createBufferSource(),fl=c.createBiquadFilter(),a=c.createGain();sr.buffer=AU.nb;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);sr.connect(fl);fl.connect(a);a.connect(dest);sr.start(t,Math.random()*.5);sr.stop(t+d+.02)}
function playSong(k){AU.song=k?SONGS[k]:null;AU.step=0;AU.lvl=0;if(AU.c)AU.next=AU.c.currentTime+.08}
function sched(){
  const c=AU.c,S=AU.song;if(!S||!AU.on)return;
  if((G&&G.pause)||document.hidden){AU.next=c.currentTime+.05;return}
  if(AU.next<c.currentTime-.2)AU.next=c.currentTime+.02;
  while(AU.next<c.currentTime+.12){beat(S,AU.step,AU.next);AU.next+=60/(S.bpm*(AU.lvl>1?1.08:1))/4;AU.step=(AU.step+1)%64}
}
function beat(S,i,t){
  const s=i%16,cd=S.prog[(i>>4)%S.prog.length],sc=SC[S.sc],L=AU.lvl,dur=60/S.bpm/4,M=AU.mu;
  const n=(dg,o)=>S.root+sc[((dg%7)+7)%7]+12*Math.floor(dg/7)+12*o,at=str=>str[s%str.length];
  if(at(S.k)==='x'||(L>1&&s%4===0))tone('sine',160,t,.22,.9,M,40);
  if(at(S.s)==='x'){noise(t,.14,.35,'bandpass',1800,M,.8);tone('triangle',200,t,.08,.25,M,120)}
  if(at(S.h)==='x')noise(t,.04,.07,'highpass',7000,M);else if(L>0)noise(t,.03,.035,'highpass',8000,M);
  const b=at(S.bass);if(b!=='.')tone('sawtooth',mf(n(cd+(b==='5'?4:0),b==='2'?1:0)),t,dur*1.6,.22,M,0,420+L*220);
  if(S.arp||L>0)tone('triangle',mf(n(cd+[0,2,4,7][s%4],2)),t,dur*.9,.05,M);
  if((S.pad||L>1)&&s===0)for(const dg of[0,2,4])tone('sawtooth',mf(n(cd+dg,1)),t,dur*16,.035,M,0,900);

  put(foe,'crab',110,2.2,.6);put(foe,'puffer',230,2,.3);put(foe,'octo',340,2.1,0);
  put(peng,'spear',580,2.2,.5);put(peng,'shield',680,2.3,.2);put(peng,'emp',800,2.4,0);put(peng,'kid',900,2,.8);C=ctx;
}
function ui(){
  if(!G)return;const m=Math.floor(G.money);$('money').textContent=m;$('mmax').textContent='/ '+wmax(G.wl);
  cards.forEach((b,i)=>{const d=P[i];b.classList.toggle('off',G.cds[i]>0||m<d.cost);b.querySelector('.cd').style.height=(G.cds[i]/d.cd*100)+'%'});
  const full=G.wl>=WMAXL;$('wl').textContent='지갑 Lv.'+G.wl;$('wc').textContent=full?'최대':wcost(G.wl);$('wallet').classList.toggle('off',full||m<wcost(G.wl));
  $('cfill').style.width=G.cannon*100+'%';const r=G.cannon>=1;$('cannon').classList.toggle('ready',r);$('ctx').textContent=r?'발사!':Math.floor(G.cannon*100)+'%';
}

/* ---------- view & input ---------- */
function clamp(){camX=Math.max(0,Math.min(WW-cw/s,camX))}
function resize(){const r=$('stage').getBoundingClientRect();if(r.width<10||r.height<10)return;DPR=Math.min(R3?(lowQ?1:1.5):2,devicePixelRatio||1);cw=r.width;ch=r.height;cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);const c3=$('cv3');c3.width=cv.width;c3.height=cv.height;s=Math.min(ch/WH,cw/500);if(cw/s>WW)s=cw/WW;clamp()}
if(init3d())$('stage').classList.add('g3');
new ResizeObserver(resize).observe($('stage'));resize();
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,c:camX,c3:camC};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag){if(R3){camC=drag.c3-(e.clientX-drag.x)*Wd/cw;clamp3()}else{camX=drag.c-(e.clientX-drag.x)/s;clamp()}}});
cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();if(R3){camC+=(e.deltaX||e.deltaY)*Wd/cw;clamp3()}else{camX+=(e.deltaX||e.deltaY)/s;clamp()}},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause(true);if(AU.c)AU.c.suspend()}else if(AU.c)AU.c.resume()});

let last=0;
function loop(ts){const raw=(ts-last)/1000||0,dt=Math.min(.05,raw);last=ts;
  if(R3&&!lowQ&&raw>0&&raw<1){ema=ema*.95+raw*.05;slowT=ema>.034?slowT+raw:0;if(slowT>2){lowQ=true;resize()}}
  if(G&&!G.pause){if(G.hitstop>0){G.hitstop-=dt;clock+=dt}else for(let k=0;k<G.speed;k++)upd(dt)}else if(!G)clock+=dt;
  if(R3){draw3();drawOv()}else draw();ui();requestAnimationFrame(loop)}
window.__pengT={get G(){return G},start,upd,buy,upWallet,fire,P,stage,wcost,WMAXL,get save(){return save}};
menu();requestAnimationFrame(loop);
if(document.fonts)document.fonts.ready.then(heroDraw);
}
